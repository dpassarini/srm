name: CI Backend (credit_engine)

on:
  push:
    branches: [ main, master, development ]
  pull_request:
    branches: [ main, master, development ]

jobs:
  lint:
    name: Run RuboCop Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: credit_engine

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.5'
          bundler-cache: true
          working-directory: credit_engine

      - name: Run RuboCop
        run: |
          bundle exec rubocop

  test:
    name: Run RSpec Tests
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: credit_engine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: credit_engine

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.5'
          bundler-cache: true
          working-directory: credit_engine

      - name: Set up database schema
        env:
          RAILS_ENV: test
          DATABASE_HOST: localhost
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: password
          DATABASE_PORT: 5432
          REDIS_URL: redis://localhost:6379/1
        run: |
          bundle exec rails db:test:prepare

      - name: Run RSpec tests
        env:
          RAILS_ENV: test
          DATABASE_HOST: localhost
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: password
          DATABASE_PORT: 5432
          REDIS_URL: redis://localhost:6379/1
        run: |
          bundle exec rspec
