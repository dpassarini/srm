openapi: 3.0.3
info:
  title: SRM Credit Engine API
  description: |
    API para a Plataforma de Cessão de Crédito Multimoedas (**SRM Credit Engine**).
    
    Esta API permite:
    - Consultar moedas suportadas e tipos de recebíveis (com seus respectivos spreads base).
    - Gerenciar taxas de câmbio diárias (com inserção automática da taxa inversa).
    - Simular e precificar lotes de recebíveis (Duplicatas e Cheques) usando estratégias de risco desacopladas.
    - Liquidação assíncrona de operações de cessão de crédito via processamento em fila.
    - Gerar e baixar relatórios analíticos de liquidação (CSV).
  version: 1.0.0
servers:
  - url: http://localhost:3000/api/v1
    description: Servidor de Desenvolvimento Local

paths:
  /currencies:
    get:
      summary: Listar todas as moedas suportadas
      description: Retorna uma lista de todas as moedas cadastradas no sistema, ordenadas por código.
      responses:
        '200':
          description: Lista de moedas obtida com sucesso.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Currency'
              example:
                - id: 1
                  code: BRL
                  name: Real Brasileiro
                  symbol: R$
                - id: 2
                  code: USD
                  name: Dólar Americano
                  symbol: $

  /receivable_types:
    get:
      summary: Listar tipos de recebíveis
      description: "Retorna os tipos de recebíveis cadastrados no sistema (ex: duplicata, cheque) juntamente com suas taxas de spread base."
      responses:
        '200':
          description: Lista de tipos de recebíveis obtida com sucesso.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReceivableType'
              example:
                - id: 1
                  name: Duplicata Mercantil
                  code: duplicata
                  base_spread: "0.0150"
                - id: 2
                  name: Cheque Pré-datado
                  code: cheque
                  base_spread: "0.0250"

  /exchange_rates:
    get:
      summary: Listar taxas de câmbio recentes
      description: Retorna as 50 taxas de câmbio mais recentes cadastradas no sistema, ordenadas por data de referência decrescente.
      responses:
        '200':
          description: Lista de taxas de câmbio obtida com sucesso.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExchangeRateResponse'
              example:
                - id: 1
                  rate: "5.00000000"
                  reference_date: "2026-06-09"
                  from_currency:
                    code: USD
                    symbol: $
                  to_currency:
                    code: BRL
                    symbol: R$
                - id: 2
                  rate: "0.20000000"
                  reference_date: "2026-06-09"
                  from_currency:
                    code: BRL
                    symbol: R$
                  to_currency:
                    code: USD
                    symbol: $

    post:
      summary: Cadastrar nova taxa de câmbio
      description: |
        Cadastra uma nova taxa cambial para uma data de referência. 
        **Nota:** O sistema calcula e salva automaticamente a taxa reversa correspondente (1/taxa) na mesma transação.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - exchange_rate
              properties:
                exchange_rate:
                  $ref: '#/components/schemas/ExchangeRateInput'
      responses:
        '201':
          description: Taxa cambial cadastrada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeRateCreatedResponse'
              example:
                id: 3
                rate: "5.25000000"
                reference_date: "2026-06-09"
                from_currency:
                  code: USD
                to_currency:
                  code: BRL
        '400':
          description: Parâmetros inválidos ou taxa menor/igual a zero.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "A taxa cambial deve ser maior que zero."
        '422':
          description: Entidade não processável (erros de validação).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /operations:
    get:
      summary: Consultar histórico de operações
      description: Retorna o histórico consolidado de operações de liquidação com suporte a paginação e filtros dinâmicos.
      parameters:
        - name: page
          in: query
          description: Número da página para paginação.
          required: false
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          description: Quantidade de itens por página.
          required: false
          schema:
            type: integer
            default: 10
        - name: assignee
          in: query
          description: Filtrar por nome do cedente (busca parcial insensível a maiúsculas/minúsculas).
          required: false
          schema:
            type: string
        - name: payment_currency_code
          in: query
          description: "Filtrar por código da moeda de pagamento (ex: BRL, USD)."
          required: false
          schema:
            type: string
        - name: start_date
          in: query
          description: Data de início do período (ISO 8601).
          required: false
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          description: Data de término do período (ISO 8601).
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Histórico de operações obtido com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationHistoryResponse'
              example:
                operations:
                  - id: 10
                    assignee: "John Doe Ltda"
                    total_face_value: "5000.0000"
                    total_net_value: "4850.2500"
                    status: "completed"
                    created_at: "2026-06-09T10:15:30.000-03:00"
                    payment_currency:
                      code: BRL
                      symbol: R$
                    receivables:
                      - id: 15
                        identifier: "DUP-99882"
                        face_value: "5000.0000"
                        net_value: "4850.2500"
                        due_date: "2026-07-09"
                        days_to_maturity: 30
                        spread_applied: "0.0150"
                        base_rate_applied: "0.0100"
                        exchange_rate_applied: null
                        currency:
                          code: BRL
                          symbol: R$
                        receivable_type:
                          code: duplicata
                          name: "Duplicata Mercantil"
                meta:
                  current_page: 1
                  per_page: 10
                  total_pages: 1
                  total_count: 1

    post:
      summary: Criar nova operação (Liquidação Assíncrona)
      description: |
        Cria um lote de operação no status `pending` e enfileira um job assíncrono (`SettleOperationJob`) para realizar a precificação de cada recebível sob transações ACID seguras.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - operation
              properties:
                operation:
                  $ref: '#/components/schemas/OperationInput'
      responses:
        '201':
          description: Operação criada com sucesso e enviada para processamento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationCreatedResponse'
              example:
                id: 11
                assignee: "John Doe Ltda"
                total_face_value: "0.0000"
                total_net_value: "0.0000"
                status: "pending"
                created_at: "2026-06-09T10:20:00.000-03:00"
                payment_currency:
                  code: BRL
                  symbol: R$
                receivables: []
        '400':
          description: "Erro na requisição (ex: erro cambial ou datas inválidas)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Taxa de câmbio de USD para BRL não encontrada para a data 2026-06-09"
        '422':
          description: Validação falhou.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /operations/simulate:
    post:
      summary: Simular precificação de operação
      description: |
        Simula os cálculos de valor presente (deságio) e conversões cambiais para um lote de recebíveis sem persistir os dados no banco de dados. 
        Ideal para cotações em tempo real no painel do operador.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - operation
              properties:
                operation:
                  $ref: '#/components/schemas/OperationInput'
      responses:
        '200':
          description: Simulação calculada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationResponse'
              example:
                assignee: "John Doe Ltda"
                payment_currency_id: 1
                total_face_value: 1000.0
                total_net_value: 196.0
                receivables_attributes:
                  - identifier: "CHQ-8871"
                    face_value: 1000.0
                    net_value_original: 980.0
                    net_value: 196.0
                    due_date: "2026-07-09"
                    days_to_maturity: 30
                    spread_applied: 0.025
                    base_rate_applied: 0.0
                    exchange_rate_applied: 0.2
                    receivable_type_id: 2
                    currency_id: 1
        '400':
          description: Erro no cálculo da simulação.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Data de vencimento não pode ser anterior à data da operação"

  /settlement_reports:
    get:
      summary: Listar solicitações de relatórios de extrato
      description: Retorna as últimas 20 solicitações de extrato de liquidação criadas no sistema.
      responses:
        '200':
          description: Lista de solicitações obtida com sucesso.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SettlementReport'
              example:
                - id: 5
                  assignee_filter: "John Doe"
                  payment_currency_code_filter: "BRL"
                  start_date_filter: "2026-06-01"
                  end_date_filter: "2026-06-30"
                  status: "completed"
                  file_name: "extrato_20260609102211.csv"
                  created_at: "2026-06-09T10:22:11.000-03:00"
                  updated_at: "2026-06-09T10:22:15.000-03:00"

    post:
      summary: Solicitar geração de relatório de extrato
      description: |
        Cria uma solicitação de relatório filtrada e inicia o processamento assíncrono (`GenerateSettlementReportJob`) para compilação dos dados em CSV.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - settlement_report
              properties:
                settlement_report:
                  $ref: '#/components/schemas/SettlementReportInput'
      responses:
        '201':
          description: Solicitação de relatório criada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementReport'
              example:
                id: 6
                assignee_filter: "John Doe"
                payment_currency_code_filter: "BRL"
                start_date_filter: "2026-06-01"
                end_date_filter: "2026-06-30"
                status: "pending"
                file_name: "extrato_20260609102500.csv"
                created_at: "2026-06-09T10:25:00.000-03:00"
                updated_at: "2026-06-09T10:25:00.000-03:00"
        '422':
          description: Erro ao registrar solicitação de relatório.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /settlement_reports/{id}/download:
    get:
      summary: Baixar arquivo CSV do relatório
      description: Retorna o arquivo CSV correspondente ao extrato de liquidação solicitado, caso o processamento já tenha sido concluído com sucesso.
      parameters:
        - name: id
          in: path
          description: ID da solicitação do relatório de extrato.
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Download do arquivo CSV iniciado.
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="extrato_20260609102211.csv"
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '400':
          description: O relatório solicitado ainda está pendente ou falhou.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Relatório não está pronto ou falhou"
        '404':
          description: Relatório não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Couldn't find SettlementReport with 'id'=99"

components:
  schemas:
    Currency:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        symbol:
          type: string

    ReceivableType:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        code:
          type: string
        base_spread:
          type: string
          description: 'Taxa de spread base representada como uma string de valor decimal (ex: "0.0150").'

    ExchangeRateInput:
      type: object
      required:
        - from_currency_code
        - to_currency_code
        - rate
      properties:
        from_currency_code:
          type: string
          example: USD
        to_currency_code:
          type: string
          example: BRL
        rate:
          type: number
          format: float
          example: 5.25
        reference_date:
          type: string
          format: date
          description: Opcional. Data de referência da taxa cambial. Se omitida, assume o dia corrente.
          example: "2026-06-09"

    ExchangeRateCreatedResponse:
      type: object
      properties:
        id:
          type: integer
        rate:
          type: string
          example: "5.25000000"
        reference_date:
          type: string
          format: date
        from_currency:
          type: object
          properties:
            code:
              type: string
        to_currency:
          type: object
          properties:
            code:
              type: string

    ExchangeRateResponse:
      type: object
      properties:
        id:
          type: integer
        rate:
          type: string
        reference_date:
          type: string
          format: date
        from_currency:
          type: object
          properties:
            code:
              type: string
            symbol:
              type: string
        to_currency:
          type: object
          properties:
            code:
              type: string
            symbol:
              type: string

    OperationInput:
      type: object
      required:
        - assignee
        - payment_currency_code
        - receivables
      properties:
        assignee:
          type: string
          description: Nome do cedente responsável pela operação.
          example: "John Doe Ltda"
        payment_currency_code:
          type: string
          description: "Código da moeda em que a liquidação será paga (ex: BRL ou USD)."
          example: BRL
        base_rate:
          type: number
          format: float
          default: 0.0
          description: Taxa base opcional de desconto/juros a ser aplicada além do spread.
          example: 0.01
        receivables:
          type: array
          items:
            $ref: '#/components/schemas/ReceivableInput'

    ReceivableInput:
      type: object
      required:
        - identifier
        - face_value
        - due_date
        - receivable_type_code
      properties:
        identifier:
          type: string
          description: "Identificador único da duplicata ou cheque (ex: número da nota/contrato)."
          example: "DUP-12345"
        face_value:
          type: number
          format: float
          description: Valor de face do título.
          example: 10000.00
        due_date:
          type: string
          format: date
          description: Data de vencimento do título.
          example: "2026-07-09"
        receivable_type_code:
          type: string
          description: Tipo de recebível (duplicata ou cheque).
          example: duplicata
        currency_code:
          type: string
          description: Código da moeda de face do recebível. Se não informado, herda o payment_currency_code da operação.
          example: BRL

    OperationCreatedResponse:
      type: object
      properties:
        id:
          type: integer
        assignee:
          type: string
        total_face_value:
          type: string
          example: "0.0000"
        total_net_value:
          type: string
          example: "0.0000"
        status:
          type: string
          example: "pending"
        created_at:
          type: string
          format: date-time
        payment_currency:
          type: object
          properties:
            code:
              type: string
            symbol:
              type: string
        receivables:
          type: array
          items:
            type: object

    OperationHistoryResponse:
      type: object
      properties:
        operations:
          type: array
          items:
            $ref: '#/components/schemas/OperationHistoryItem'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    OperationHistoryItem:
      type: object
      properties:
        id:
          type: integer
        assignee:
          type: string
        total_face_value:
          type: string
        total_net_value:
          type: string
        status:
          type: string
          enum: [pending, completed, failed]
        created_at:
          type: string
          format: date-time
        payment_currency:
          type: object
          properties:
            code:
              type: string
            symbol:
              type: string
        receivables:
          type: array
          items:
            $ref: '#/components/schemas/ReceivableDetail'

    ReceivableDetail:
      type: object
      properties:
        id:
          type: integer
        identifier:
          type: string
        face_value:
          type: string
        net_value:
          type: string
        due_date:
          type: string
          format: date
        days_to_maturity:
          type: integer
        spread_applied:
          type: string
        base_rate_applied:
          type: string
        exchange_rate_applied:
          type: string
          nullable: true
        currency:
          type: object
          properties:
            code:
              type: string
            symbol:
              type: string
        receivable_type:
          type: object
          properties:
            code:
              type: string
            name:
              type: string

    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        per_page:
          type: integer
        total_pages:
          type: integer
        total_count:
          type: integer

    SimulationResponse:
      type: object
      properties:
        assignee:
          type: string
        payment_currency_id:
          type: integer
        total_face_value:
          type: number
        total_net_value:
          type: number
        receivables_attributes:
          type: array
          items:
            $ref: '#/components/schemas/CalculatedReceivable'

    CalculatedReceivable:
      type: object
      properties:
        identifier:
          type: string
        face_value:
          type: number
        net_value_original:
          type: number
        net_value:
          type: number
        due_date:
          type: string
          format: date
        days_to_maturity:
          type: integer
        spread_applied:
          type: number
        base_rate_applied:
          type: number
        exchange_rate_applied:
          type: number
          nullable: true
        receivable_type_id:
          type: integer
        currency_id:
          type: integer

    SettlementReportInput:
      type: object
      properties:
        assignee_filter:
          type: string
          nullable: true
          example: "John Doe"
        payment_currency_code_filter:
          type: string
          nullable: true
          example: BRL
        start_date_filter:
          type: string
          format: date
          nullable: true
          example: "2026-06-01"
        end_date_filter:
          type: string
          format: date
          nullable: true
          example: "2026-06-30"

    SettlementReport:
      type: object
      properties:
        id:
          type: integer
        assignee_filter:
          type: string
          nullable: true
        payment_currency_code_filter:
          type: string
          nullable: true
        start_date_filter:
          type: string
          nullable: true
        end_date_filter:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, completed, failed]
        file_name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        error:
          type: string

    ValidationErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "Entidade Não Processável"
        details:
          type: array
          items:
            type: string
          example: ["Assignee não pode ficar em branco"]
